name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Audio engine tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run engine tests
        run: ./core/audio/native-tests/run.sh

  android:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew test --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jeang-beat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload screen renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
