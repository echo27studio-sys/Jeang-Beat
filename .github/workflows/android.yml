name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Audio engine tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and run engine tests
        run: ./core/audio/native-tests/run.sh

  android:
    name: Unit tests & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        # The runner image ships the Android SDK; add the exact versions this project uses.
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests (model, data, audio API)
        run: ./gradlew :core:model:test :core:data:test :core:audio:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: jeang-beat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
