name: Release APK

# Push a tag like v0.1.0 to build a signed release APK and publish it on the
# GitHub Releases page. Requires the signing secrets described in docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        # The runner image ships the Android SDK; add the exact versions this project uses.
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::JB_KEYSTORE_BASE64 secret is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "JB_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          JB_KEYSTORE_PASSWORD: ${{ secrets.JB_KEYSTORE_PASSWORD }}
          JB_KEY_ALIAS: ${{ secrets.JB_KEY_ALIAS }}
          JB_KEY_PASSWORD: ${{ secrets.JB_KEY_PASSWORD }}
        run: ./gradlew :core:model:test :core:data:test :core:audio:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "JeangBeat-${GITHUB_REF_NAME}.apk"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: JeangBeat-*.apk
          generate_release_notes: true
